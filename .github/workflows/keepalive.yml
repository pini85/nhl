name: keepalive
# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. Re-enabling them monthly keeps the collector running.
on:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
