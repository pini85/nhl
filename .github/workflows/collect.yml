name: collect
# Saves new EA games every ~10 minutes in the evening (18:00-03:00 Amsterdam) and hourly
# the rest of the day, so the database can sleep between runs. GitHub's cron is unreliable
# on new repos, so each run waits, then starts the next one (workflow_dispatch from GITHUB_TOKEN
# is allowed); the hourly cron only restarts the chain if it ever breaks.
# The concurrency group keeps at most one running + one waiting, so chains can't pile up.
# To stop collecting: disable this workflow in the Actions tab.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect:ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_TRIGGER: cron
      # Posts last night's recap to Discord once per night (from 08:00 Amsterdam time the morning after). Never blocks collecting.
      - name: Discord recap
        if: always()
        continue-on-error: true
        run: pnpm discord:recap
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Scout requests are answered by the scout workflow, which the website starts.
      - name: Wait until the next run
        if: always()
        run: |
          delay=$(pnpm --silent next-run-delay || echo 480)
          echo "next run in ${delay}s"
          sleep "$delay"
      - name: Start the next run
        if: always()
        run: gh workflow run collect.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
