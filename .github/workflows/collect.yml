name: collect
# Saves new EA games every ~10 minutes. GitHub's cron is unreliable on new repos,
# so each run also starts the next one (workflow_dispatch from GITHUB_TOKEN is allowed).
# The concurrency group keeps at most one running + one waiting, so chains can't pile up.
# To stop collecting: disable this workflow in the Actions tab.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect:ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_TRIGGER: cron
      - name: Wait before the next run
        if: always()
        run: sleep 480
      - name: Start the next run
        if: always()
        run: gh workflow run collect.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
